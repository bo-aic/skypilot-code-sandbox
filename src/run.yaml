name: joschkas_clowd

resources:
  cloud: aws
  region: us-east-1
  # Default profile: data engineering (many CPUs, high network throughput).
  # For a cheap Claude box or a GPU machine, launch via ./launch.sh — its
  # --instance-type/--gpus/--image-id flags override this any_of list.
  any_of:
    - instance_type: m5n.4xlarge
    - instance_type: c6i.4xlarge
    - instance_type: m6in.4xlarge
    # - instance_type: c6in.8xlarge
    # - instance_type: m5n.8xlarge
    - instance_type: m5zn.6xlarge

file_mounts:
  /bucket_data:
    source: r2://joschkas-clowd/ # or GCS, or Azure Blob Storage, or R2, etc.
  ~/.aws/config: ~/.aws/config
  ~/.env: .env

workdir: src

setup: |
  # Source .env in interactive shells
  grep -qxF 'set -a && source ~/.env && set +a' ~/.bashrc || echo 'set -a && source ~/.env && set +a' >> ~/.bashrc

  # Install uv
  curl -LsSf https://astral.sh/uv/install.sh | sh

  # Install gh CLI for PR creation
  if ! command -v gh >/dev/null 2>&1; then
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    sudo apt update && sudo apt install -y gh
  fi

  # Git auth via GH_TOKEN (fine-grained PAT in ~/.env) — no SSH keys on the VM.
  # gh reads GH_TOKEN from the env; setup-git routes git's HTTPS credentials
  # through gh, so plain `git push`/`pull` on github.com clones just work.
  set -a && source ~/.env && set +a
  gh auth setup-git 2>/dev/null || true

  # Git defaults (adapted from anilkeshwani/dotfiles)
  git config --global user.name "jj-wohlgemuth"
  git config --global user.email "52459869+jj-wohlgemuth@users.noreply.github.com"
  git config --global init.defaultBranch main
  git config --global push.autoSetupRemote true
  git config --global diff.algorithm histogram
  git config --global merge.conflictstyle diff3

  # Global gitignore: never commit OS junk or local Claude settings
  mkdir -p ~/.config/git
  printf '.DS_Store\n**/.claude/settings.local.json\n' > ~/.config/git/ignore

  # tmux QoL (adapted from anilkeshwani/dotfiles): mouse support, new
  # splits/windows inherit the current pane's working directory
  cat > ~/.tmux.conf <<'TMUX'
  set-option -g mouse on
  set-option -g history-file ~/.tmux_history
  bind '"' split-window -c "#{pane_current_path}"
  bind % split-window -h -c "#{pane_current_path}"
  bind c new-window -c "#{pane_current_path}"
  TMUX

  # Terminfo for uv-installed Python TUIs (nvitop etc.): uv's python-build-
  # standalone bundles an ncurses that misses Debian's terminfo locations
  grep -qxF 'export TERMINFO_DIRS="/etc/terminfo:/lib/terminfo:/usr/share/terminfo"' ~/.bashrc || \
    echo 'export TERMINFO_DIRS="/etc/terminfo:/lib/terminfo:/usr/share/terminfo"' >> ~/.bashrc

  # Install Claude Code
  curl -fsSL https://claude.ai/install.sh | bash || true

  # Install AWS CLI v2 (v1 doesn't support SSO)
  if ! aws --version 2>&1 | grep -q 'aws-cli/2'; then
    curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    unzip -q /tmp/awscliv2.zip -d /tmp
    sudo /tmp/aws/install --update
    rm -rf /tmp/awscliv2.zip /tmp/aws
  fi

  # Install build tools (gcc required for packages like pesq) and bubblewrap
  # (required by Claude Code's bash sandbox, enabled in claude-settings.json)
  sudo apt-get update && sudo apt-get install -y gcc build-essential bubblewrap

  # Install ffmpeg
  if ! command -v ffmpeg >/dev/null 2>&1; then
    sudo apt-get install -y ffmpeg
  fi

  # Install rclone for R2-backed Claude memory
  if ! command -v rclone >/dev/null 2>&1; then
    curl https://rclone.org/install.sh | sudo bash
  fi

  # Configure rclone for R2
  set -a && source ~/.env && set +a
  mkdir -p ~/.config/rclone
  printf '[r2]\ntype = s3\nprovider = Cloudflare\naccess_key_id = %s\nsecret_access_key = %s\nendpoint = %s\n' \
    "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$R2_ENDPOINT" > ~/.config/rclone/rclone.conf

  # Mount R2 claude-memory/ to ~/.claude/ (persistent shared memory + Claude Code OAuth credentials)
  mkdir -p ~/.claude
  grep -qxF 'rclone mount r2:joschkas-clowd/claude-memory ~/.claude --daemon --allow-non-empty --vfs-cache-mode full' ~/.bashrc || \
    echo 'rclone mount r2:joschkas-clowd/claude-memory ~/.claude --daemon --allow-non-empty --vfs-cache-mode full' >> ~/.bashrc

  # Wait for the mount before any interactive shell continues, so `claude` writes
  # credentials into the R2-backed dir (not the local empty one).
  grep -qxF '{ for _ in $(seq 1 50); do mountpoint -q ~/.claude && break; sleep 0.1; done; }' ~/.bashrc || \
    echo '{ for _ in $(seq 1 50); do mountpoint -q ~/.claude && break; sleep 0.1; done; }' >> ~/.bashrc

  # Surface CLAUDE.md from any cwd: symlink workdir copy to $HOME
  ln -sf ~/sky_workdir/CLAUDE.md ~/CLAUDE.md

  # VSCode "Claude" terminal profile (Machine-scoped, applies to all remote workspaces).
  # Pick "Claude" from the VSCode terminal dropdown to land in a tmux session
  # running `claude` in ~/sky_workdir/. Default profile stays plain bash.
  mkdir -p ~/.vscode-server/data/Machine
  if [ ! -f ~/.vscode-server/data/Machine/settings.json ]; then
    cat > ~/.vscode-server/data/Machine/settings.json <<'JSON'
  {
    "terminal.integrated.profiles.linux": {
      "Claude": {
        "path": "bash",
        "args": ["-lc", "cd ~/sky_workdir && tmux new -A -s claude claude"],
        "icon": "robot"
      },
      "bash": {
        "path": "bash"
      }
    }
  }
  JSON
  fi

run: |
  set -a && source ~/.env && set +a

  # Mount shared Claude memory from R2
  mkdir -p ~/.claude
  rclone mount r2:joschkas-clowd/claude-memory ~/.claude --daemon --allow-non-empty --vfs-cache-mode full

  # Wait for mount, then install/refresh ai-coustics agent-skills marketplace.
  # Private repo — cloned over HTTPS; git credentials come from GH_TOKEN via the
  # gh credential helper configured in setup. Plugin state lands under ~/.claude/
  # which is R2-backed, so a fresh VM with a populated R2 bucket already has the
  # skills.
  for _ in $(seq 1 50); do mountpoint -q ~/.claude && break; sleep 0.1; done
  export PATH="$HOME/.local/bin:$PATH"
  if mountpoint -q ~/.claude && command -v claude >/dev/null 2>&1; then
    claude plugin marketplace add https://github.com/ai-coustics/agent-skills 2>/dev/null || true
    claude plugin install ai-coustics@ai-coustics-agent-skills 2>/dev/null || true
    claude plugin marketplace add https://github.com/skypilot-org/skypilot 2>/dev/null || true
    claude plugin install skypilot@skypilot 2>/dev/null || true
  fi

  # Claude Code settings (permissions allowlist, sandbox, auto mode) — source of
  # truth is claude-settings.json in this repo; installed into the R2-backed
  # ~/.claude/ on every boot, so repo edits win over ad-hoc VM edits.
  if mountpoint -q ~/.claude; then
    cp ~/sky_workdir/claude-settings.json ~/.claude/settings.json
  fi

  # Install personal skills (deslop + excalidraw) and reviewer agents from
  # anilkeshwani/dotfiles. ~/.claude/ is R2-backed so they persist; re-sync
  # each boot for updates.
  if mountpoint -q ~/.claude; then
    rm -rf /tmp/ak-dotfiles
    if git clone --depth 1 --filter=blob:none --sparse https://github.com/anilkeshwani/dotfiles.git /tmp/ak-dotfiles 2>/dev/null; then
      git -C /tmp/ak-dotfiles sparse-checkout set home/.claude/skills home/.claude/agents
      mkdir -p ~/.claude/skills ~/.claude/agents
      for s in deslop-code deslop-prose excalidraw; do
        rm -rf ~/.claude/skills/$s
        cp -r /tmp/ak-dotfiles/home/.claude/skills/$s ~/.claude/skills/
      done
      for a in architect-reviewer researcher-reviewer senior-mle-reviewer; do
        cp /tmp/ak-dotfiles/home/.claude/agents/$a.md ~/.claude/agents/
      done
    fi
    rm -rf /tmp/ak-dotfiles

    # visual-explainer skill (nicobailon), latest main. The repo has moved the
    # skill around (root -> plugins/visual-explainer/), so locate SKILL.md.
    rm -rf /tmp/visual-explainer
    if git clone --quiet --depth 1 https://github.com/nicobailon/visual-explainer.git /tmp/visual-explainer 2>/dev/null; then
      ve_src=$(dirname "$(find /tmp/visual-explainer -name SKILL.md -not -path '*/.git/*' | head -1)")
      if [ -f "$ve_src/SKILL.md" ]; then
        rm -rf ~/.claude/skills/visual-explainer
        cp -r "$ve_src" ~/.claude/skills/visual-explainer
      fi
    fi
    rm -rf /tmp/visual-explainer
  fi

  echo "VM boot complete — SSH in and run claude from ~/sky_workdir"
